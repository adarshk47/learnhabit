name: bike_ai_analyzer
description: AI-powered bike riding analysis system
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.3
  web_socket_channel: ^2.4.0
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  sensors_plus: ^4.0.2
  flutter_tts: ^3.8.5
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  fl_chart: ^0.65.0
  syncfusion_flutter_gauges: ^23.2.7
  video_player: ^2.8.1
  http: ^1.1.2
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  share_plus: ^7.2.1
  pdf: ^3.10.7
  printing: ^5.12.0
  flutter_local_notifications: ^18.0.0
  network_info_plus: ^5.0.3
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/models/
    - assets/images/
