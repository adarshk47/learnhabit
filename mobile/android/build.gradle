// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Force all Android plugin subprojects to compile against a modern SDK.
// Several Flutter plugins (flutter_tts, sensors_plus, share_plus, network_info_plus)
// hardcode compileSdk 31, but their AndroidX transitive dependencies now require 34+.
// This override bumps every Android subproject to compileSdk 36 so the AAR metadata
// check passes without us having to fork/upgrade each plugin individually.
subprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            project.android {
                compileSdk = 36
            }
        }
    }
}
